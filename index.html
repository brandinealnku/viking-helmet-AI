<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI-Centered Sunglasses Filter – JS + BlazeFace</title>

  <!-- TensorFlow.js + BlazeFace (face detection) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 0.25rem;
      text-align: center;
    }
    p {
      margin-top: 0;
      margin-bottom: 1rem;
      text-align: center;
      max-width: 600px;
    }
    #videoContainer {
      position: relative;
      width: 640px;
      height: 480px;
      background: #020617;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 20px;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1; /* above the video */
    }
    #status {
      margin-top: 12px;
      font-size: 1rem;
      color: #a5b4fc;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>😎 AI-Centered Sunglasses Filter (JS + BlazeFace)</h1>
  <p>
    JavaScript is grabbing the webcam, running a BlazeFace model in your browser to detect your face,
    and turning this sunglasses overlay <strong>on</strong> only when a face is detected.
  </p>

  <div id="videoContainer">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">Loading camera…</div>

  <script>
    const NKU_GOLD = "#f7b718";

    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    let model = null;
    let videoReady = false;

    console.log("🔥 AI centered sunglasses script running");

    // 1️⃣ Camera setup
    async function setupCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }
        });
        video.srcObject = stream;

        return new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            console.log("Video size:", video.videoWidth, video.videoHeight);
            videoReady = true;
            resolve();
          };
        });
      } catch (err) {
        console.error("Camera error:", err);
        statusEl.textContent = "Camera error – check permissions & HTTPS.";
      }
    }

    // 2️⃣ Draw BIG centered sunglasses (ignoring coordinates for now)
    function drawCenteredGlasses() {
      const w = canvas.width;
      const h = canvas.height;
      if (!w || !h) return;

      ctx.clearRect(0, 0, w, h);

      // Slight dark tint so students clearly see the overlay
      ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
      ctx.fillRect(0, 0, w, h);

      const centerX = w / 2;
      const centerY = h * 0.35;

      const glassesWidth = w * 0.45;
      const glassesHeight = h * 0.12;

      const bridgeWidth = glassesWidth * 0.08;
      const lensWidth = (glassesWidth - bridgeWidth) / 2;

      const lensY = centerY - glassesHeight / 2;
      const leftX = centerX - glassesWidth / 2;
      const rightX = leftX + lensWidth + bridgeWidth;

      ctx.save();
      ctx.lineWidth = 4;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      function drawLens(x, y, wLens, hLens) {
        const radius = hLens * 0.4;

        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + wLens - radius, y);
        ctx.quadraticCurveTo(x + wLens, y, x + wLens, y + radius);
        ctx.lineTo(x + wLens, y + hLens - radius);
        ctx.quadraticCurveTo(x + wLens, y + hLens, x + wLens - radius, y + hLens);
        ctx.lineTo(x + radius, y + hLens);
        ctx.quadraticCurveTo(x, y + hLens, x, y + hLens - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();

        ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
        ctx.fill();
        ctx.strokeStyle = NKU_GOLD;
        ctx.stroke();
      }

      // Left + right lenses
      drawLens(leftX, lensY, lensWidth, glassesHeight);
      drawLens(rightX, lensY, lensWidth, glassesHeight);

      // Bridge
      ctx.beginPath();
      ctx.moveTo(leftX + lensWidth, centerY);
      ctx.lineTo(rightX, centerY);
      ctx.strokeStyle = NKU_GOLD;
      ctx.stroke();

      ctx.restore();
    }

    // 3️⃣ Main AI loop – model is just an ON/OFF switch for the filter
    async function renderLoop() {
      if (!model || !videoReady) {
        requestAnimationFrame(renderLoop);
        return;
      }

      // Ask the model if there are any faces in the frame
      const predictions = await model.estimateFaces(video, false);

      if (predictions && predictions.length > 0) {
        // At least one face detected → turn the filter ON
        drawCenteredGlasses();
        statusEl.textContent =
          "AI running in browser: sunglasses ON 😎 (faces: " + predictions.length + ")";
      } else {
        // No face → clear the overlay
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        statusEl.textContent = "Model loaded — no face detected yet. 👀";
      }

      requestAnimationFrame(renderLoop);
    }

    // 4️⃣ Init everything
    async function init() {
      statusEl.textContent = "Loading camera…";
      await setupCamera();

      statusEl.textContent = "Loading AI model (BlazeFace)…";
      try {
        await tf.setBackend("webgl");
      } catch (e) {
        console.warn("Could not set backend to webgl, using default:", e);
      }
      await tf.ready();

      model = await blazeface.load();
      console.log("BlazeFace model loaded:", model);

      statusEl.textContent = "Model loaded. Looking for your face…";
      renderLoop();
    }

    init();
  </script>
</body>
</html>
