<script>
  // 🔧 CONFIG: update this to your real email
  const INSTRUCTOR_EMAIL = "your.email@nku.edu";
  const TARGET_FOLDER_LABEL = "NKU_AI_Selfies";

  const video = document.getElementById("video");
  const canvas = document.getElementById("overlay");
  const ctx = canvas.getContext("2d");
  const statusText = document.getElementById("statusText");
  const statusDot = document.getElementById("statusDot");
  const startBtn = document.getElementById("startBtn");
  const captureBtn = document.getElementById("captureBtn");
  const videoSkeleton = document.getElementById("videoSkeleton");
  const filterButtons = document.querySelectorAll(".filter-btn");

  const previewSection = document.getElementById("previewSection");
  const snapshotPreview = document.getElementById("snapshotPreview");

  let faceModel = null;         // BlazeFace
  let bodyPixModel = null;      // BodyPix (optional)
  let videoReady = false;
  let glassesImgReady = false;
  let helmetImgReady = false;
  let bgReady = false;
  let aiRunning = false;
  let lastRenderTime = 0;

  // 'glasses' | 'helmet' | 'none'
  let activeFilter = "glasses";

  // Offscreen canvases for compositing
  const tempCanvas = document.createElement("canvas");
  const tempCtx = tempCanvas.getContext("2d");

  const bgCanvas = document.createElement("canvas");
  const bgCtx = bgCanvas.getContext("2d");

  // Load Griffin Hall background image
  const bgImage = new Image();
  bgImage.src = "griffin-hall.jpg"; // make sure this path/file exists
  bgImage.onload = () => {
    bgReady = true;
    console.log("✅ Griffin Hall background loaded:", bgImage.naturalWidth, bgImage.naturalHeight);
  };
  bgImage.onerror = () => {
    console.warn("⚠️ Could not load griffin-hall.jpg. Falling back to plain video background.");
    bgReady = false;
  };

  // Load Canva PNG overlays (cropped versions)
  const glassesImg = new Image();
  glassesImg.src = "glasses.png"; // 598x212 cropped recommended
  glassesImg.onload = () => {
    glassesImgReady = true;
    console.log("✅ Glasses image loaded:", glassesImg.naturalWidth, glassesImg.naturalHeight);
  };
  glassesImg.onerror = () => console.warn("⚠️ Could not load glasses.png");

  const helmetImg = new Image();
  helmetImg.src = "helmet.png"; // 600x528 cropped recommended
  helmetImg.onload = () => {
    helmetImgReady = true;
    console.log("✅ Helmet image loaded:", helmetImg.naturalWidth, helmetImg.naturalHeight);
  };
  helmetImg.onerror = () => console.warn("⚠️ Could not load helmet.png");

  function setStatus(message, mode = "idle") {
    statusText.textContent = message;
    statusDot.classList.remove("active", "error");
    if (mode === "active") {
      statusDot.classList.add("active");
    } else if (mode === "error") {
      statusDot.classList.add("error");
    }
  }

  async function getBestBackend() {
    const backendsToTry = ["webgl", "wasm", "cpu"];
    for (const b of backendsToTry) {
      try {
        const ok = await tf.setBackend(b);
        if (ok) {
          await tf.ready();
          console.log("✅ Using TFJS backend:", tf.getBackend());
          return;
        }
      } catch (e) {
        console.warn("Backend not available:", b, e);
      }
    }
    console.warn("Using default TFJS backend:", tf.getBackend());
  }

  async function setupCamera() {
    if (!navigator.mediaDevices?.getUserMedia) {
      setStatus(
        "This browser does not support getUserMedia. Try a recent version of Chrome, Edge, Firefox, or Safari.",
        "error"
      );
      throw new Error("getUserMedia not supported");
    }

    const constraints = {
      audio: false,
      video: {
        width: { ideal: 640 },
        height: { ideal: 480 },
        facingMode: "user",
      },
    };

    try {
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;

      return new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;

          tempCanvas.width = canvas.width;
          tempCanvas.height = canvas.height;
          bgCanvas.width = canvas.width;
          bgCanvas.height = canvas.height;

          videoReady = true;
          videoSkeleton.style.display = "none";
          console.log("🎥 Video ready:", canvas.width, canvas.height);
          resolve();
        };
      });
    } catch (err) {
      console.error("Camera error:", err);
      setStatus(
        "Camera error – check permissions and make sure no other app is using the camera.",
        "error"
      );
      throw err;
    }
  }

  // Helpers for BlazeFace boxes
  function isValidPoint(pt) {
    return (
      Array.isArray(pt) &&
      pt.length >= 2 &&
      typeof pt[0] === "number" &&
      typeof pt[1] === "number" &&
      Number.isFinite(pt[0]) &&
      Number.isFinite(pt[1])
    );
  }

  function isValidBox(topLeft, bottomRight) {
    if (!isValidPoint(topLeft) || !isValidPoint(bottomRight)) return false;
    const [x1, y1] = topLeft;
    const [x2, y2] = bottomRight;
    const faceWidth = x2 - x1;
    const faceHeight = y2 - y1;
    return faceWidth > 0 && faceHeight > 0;
  }

  // 🎯 Tweaked math for cropped glasses.png
  function drawGlassesOnFace(topLeft, bottomRight) {
    if (!glassesImgReady || !isValidBox(topLeft, bottomRight)) {
      return;
    }

    const [x1, y1] = topLeft;
    const [x2, y2] = bottomRight;
    const faceWidth = x2 - x1;
    const faceHeight = y2 - y1;

    const overlayWidth = faceWidth * 1.1;
    const aspect = glassesImg.naturalHeight / glassesImg.naturalWidth;
    const overlayHeight = overlayWidth * aspect;

    const centerX = x1 + faceWidth / 2;
    const eyeLineY = y1 + faceHeight * 0.42;

    const drawX = centerX - overlayWidth / 2;
    const drawY = eyeLineY - overlayHeight / 2;

    ctx.drawImage(glassesImg, drawX, drawY, overlayWidth, overlayHeight);
  }

  // 🎯 Tweaked math for cropped helmet.png
  function drawHelmetOnFace(topLeft, bottomRight) {
    if (!helmetImgReady || !isValidBox(topLeft, bottomRight)) {
      return;
    }

    const [x1, y1] = topLeft;
    const [x2, y2] = bottomRight;
    const faceWidth = x2 - x1;
    const faceHeight = y2 - y1;

    const overlayWidth = faceWidth * 1.35;
    const aspect = helmetImg.naturalHeight / helmetImg.naturalWidth;
    const overlayHeight = overlayWidth * aspect;

    const centerX = x1 + faceWidth / 2;

    const eyebrowY = y1 + faceHeight * 0.18;
    const helmetBottomY = eyebrowY;

    const drawX = centerX - overlayWidth / 2;
    const drawY = helmetBottomY - overlayHeight;

    ctx.drawImage(helmetImg, drawX, drawY, overlayWidth, overlayHeight);
  }

  async function renderLoop(timestamp) {
    if (!faceModel || !videoReady) {
      requestAnimationFrame(renderLoop);
      return;
    }

    const msSinceLast = timestamp - lastRenderTime;
    if (msSinceLast < 70) {
      requestAnimationFrame(renderLoop);
      return;
    }
    lastRenderTime = timestamp;

    const w = canvas.width;
    const h = canvas.height;

    // Draw the current video frame as a base
    tempCtx.drawImage(video, 0, 0, w, h);

    // Decide whether to use Griffin Hall background (only if both bg and BodyPix are ready)
    const canUseBackground = bgReady && bodyPixModel;

    if (canUseBackground) {
      try {
        const segmentation = await bodyPixModel.segmentPerson(video, {
          internalResolution: "medium",
          segmentationThreshold: 0.7,
        });

        const mask = segmentation.data; // Uint8Array or Float32Array

        const frameImageData = tempCtx.getImageData(0, 0, w, h);
        const framePixels = frameImageData.data;

        bgCtx.drawImage(bgImage, 0, 0, w, h);
        const bgImageData = bgCtx.getImageData(0, 0, w, h);
        const bgPixels = bgImageData.data;

        const len = mask.length;
        for (let i = 0; i < len; i++) {
          const isPerson = mask[i] > 0; // works for 0/1 or probabilities
          const offset = i * 4;
          if (!isPerson) {
            framePixels[offset]     = bgPixels[offset];
            framePixels[offset + 1] = bgPixels[offset + 1];
            framePixels[offset + 2] = bgPixels[offset + 2];
            framePixels[offset + 3] = bgPixels[offset + 3];
          }
        }

        ctx.putImageData(frameImageData, 0, 0);
      } catch (e) {
        console.error("BodyPix error, falling back to video only:", e);
        ctx.drawImage(video, 0, 0, w, h);
      }
    } else {
      // Fallback: just draw the camera feed
      ctx.drawImage(video, 0, 0, w, h);
    }

    // Now run face detection and draw overlays on top
    let predictions = [];
    try {
      predictions = await faceModel.estimateFaces(video, false);
    } catch (e) {
      console.error("Error running BlazeFace:", e);
      setStatus("Error running the face model. Try refreshing the page.", "error");
      requestAnimationFrame(renderLoop);
      return;
    }

    if (Array.isArray(predictions) && predictions.length > 0) {
      const face = predictions[0];
      const topLeft = face.topLeft;
      const bottomRight = face.bottomRight;

      if (activeFilter === "glasses") {
        drawGlassesOnFace(topLeft, bottomRight);
        setStatus(
          canUseBackground
            ? "AI is running: glasses filter with Griffin Hall background."
            : "AI is running: glasses filter on live camera.",
          "active"
        );
      } else if (activeFilter === "helmet") {
        drawHelmetOnFace(topLeft, bottomRight);
        setStatus(
          canUseBackground
            ? "AI is running: helmet filter with Griffin Hall background."
            : "AI is running: helmet filter on live camera.",
          "active"
        );
      } else {
        setStatus(
          canUseBackground
            ? "AI is running with Griffin Hall background. No visual filter applied."
            : "AI is running on live camera. No visual filter applied.",
          "active"
        );
      }
    } else {
      setStatus("Models loaded — we don’t see a face yet.", "active");
    }

    requestAnimationFrame(renderLoop);
  }

  function captureSnapshot() {
    if (!videoReady) return;
    const w = canvas.width;
    const h = canvas.height;
    if (!w || !h) return;

    // Canvas already has the final composited frame -> just grab it
    const snapCanvas = document.createElement("canvas");
    snapCanvas.width = w;
    snapCanvas.height = h;
    const sctx = snapCanvas.getContext("2d");

    sctx.drawImage(canvas, 0, 0, w, h);

    const dataURL = snapCanvas.toDataURL("image/png");

    // Show preview
    snapshotPreview.src = dataURL;
    previewSection.style.display = "block";

    // Download PNG
    const a = document.createElement("a");
    const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
    a.href = dataURL;
    a.download = `${TARGET_FOLDER_LABEL}-selfie-${timestamp}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setStatus(
      "Snapshot saved. Check your Downloads and attach it if you choose to email it.",
      "active"
    );

    const ok = confirm(
      `Do you want to email this snapshot to your instructor at ${INSTRUCTOR_EMAIL}?\n\n` +
      `Your email app will open with a pre-filled message. Please attach the PNG from your Downloads.`
    );

    if (ok) {
      const subject = encodeURIComponent("NKU Norse AI Filter Snapshot");
      const body = encodeURIComponent(
        "Hi,\n\nHere is my NKU Norse AI Filter selfie.\n\n" +
        "I have attached the PNG file that was downloaded from the demo.\n\n" +
        "- "
      );
      const mailtoLink = `mailto:${INSTRUCTOR_EMAIL}?subject=${subject}&body=${body}`;
      window.location.href = mailtoLink;
    } else {
      setStatus(
        "Snapshot captured. You decided not to email it (which is totally fine).",
        "active"
      );
    }
  }

  async function startExperience() {
    try {
      startBtn.disabled = true;
      captureBtn.disabled = true;
      setStatus("Requesting camera access…", "idle");

      await setupCamera();

      setStatus("Loading AI models…", "idle");
      await getBestBackend();

      // Face detection model
      faceModel = await blazeface.load();

      // Try to load BodyPix, but don't fail the whole demo if it breaks
      try {
        bodyPixModel = await bodyPix.load({
          architecture: "MobileNetV1",
          outputStride: 16,
          multiplier: 0.75,
          quantBytes: 2,
        });
        console.log("✅ BodyPix model loaded");
      } catch (e) {
        console.warn("⚠️ BodyPix failed to load. Continuing without background replacement.", e);
        bodyPixModel = null;
      }

      aiRunning = true;
      captureBtn.disabled = false;

      setStatus(
        "AI is ready. Move into frame and watch the filter follow your face.",
        "active"
      );

      requestAnimationFrame(renderLoop);
    } catch (err) {
      console.error("Init error:", err);
      startBtn.disabled = false;
      setStatus(
        "This device or browser may not fully support this demo. Try a recent version of Chrome, Edge, Firefox, or Safari over HTTPS.",
        "error"
      );
    }
  }

  // Filter buttons
  filterButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      const chosen = btn.getAttribute("data-filter");
      activeFilter = chosen;

      filterButtons.forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");

      if (activeFilter === "glasses") {
        setStatus(
          "Glasses filter selected. When the AI sees your face, it will add the overlay.",
          aiRunning ? "active" : "idle"
        );
      } else if (activeFilter === "helmet") {
        setStatus(
          "Helmet filter selected. When the AI sees your face, it will add the overlay.",
          aiRunning ? "active" : "idle"
        );
      } else {
        setStatus(
          "No filter selected. The AI still runs, but nothing is added on top of the video.",
          aiRunning ? "active" : "idle"
        );
      }
    });
  });

  startBtn.addEventListener("click", startExperience);
  captureBtn.addEventListener("click", captureSnapshot);
</script>
