<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Viking Helmet Overlay (Reliable Demo)</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 0.25rem;
      text-align: center;
    }
    p {
      margin-top: 0;
      margin-bottom: 1rem;
      text-align: center;
      max-width: 600px;
    }
    #videoContainer {
      position: relative;
      width: 640px;
      height: 480px;
      background: #020617;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 20px;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1; /* above the video */
    }
    #status {
      margin-top: 12px;
      font-size: 1rem;
      color: #a5b4fc;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>🪖 Viking Helmet Overlay (Canvas Demo)</h1>
  <p>
    This shows how JavaScript can draw graphics on top of a live camera feed using
    <code>&lt;canvas&gt;</code>. Real AI demos use the same idea, but move the helmet based on
    face-tracking instead of a fixed position.
  </p>

  <div id="videoContainer">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">Loading camera…</div>

  <script>
    const NKU_GOLD = "#f7b718";
    const NKU_BLACK = "#111111";
    const NKU_WHITE = "#ffffff";
    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    console.log("🔥 Simple overlay script running");

    async function setupCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }
        });
        video.srcObject = stream;

        return new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            console.log("Video size:", video.videoWidth, video.videoHeight);
            resolve();
          };
        });
      } catch (err) {
        console.error("Camera error:", err);
        statusEl.textContent = "Camera error – check permissions & HTTPS.";
      }
    }

    function drawStaticHelmet() {
  const w = canvas.width;
  const h = canvas.height;

  // Clear previous frame
  ctx.clearRect(0, 0, w, h);

  // Slight dark overlay to make the helmet pop
  ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
  ctx.fillRect(0, 0, w, h);

  // Position & size relative to video size
  const faceWidth = w * 0.3;
  const centerX = w / 2;
  const topFaceY = h * 0.28;

  const helmetWidth = faceWidth * 1.7;
  const helmetHeight = faceWidth * 0.9;
  const helmetTopY = topFaceY - helmetHeight * 0.6;
  const helmetBottomY = topFaceY + helmetHeight * 0.25;

  ctx.save();
  ctx.lineWidth = 3;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  // === 1) Main helmet shape (black, slightly angular) ===
  ctx.beginPath();
  // Left side
  ctx.moveTo(centerX - helmetWidth * 0.5, helmetBottomY);
  ctx.lineTo(centerX - helmetWidth * 0.55, helmetTopY + helmetHeight * 0.3);
  ctx.quadraticCurveTo(
    centerX,
    helmetTopY - helmetHeight * 0.4,         // peak
    centerX + helmetWidth * 0.55,
    helmetTopY + helmetHeight * 0.3          // right upper
  );
  // Right side down
  ctx.lineTo(centerX + helmetWidth * 0.5, helmetBottomY);
  // Bottom edge back to start
  ctx.quadraticCurveTo(
    centerX,
    helmetBottomY + helmetHeight * 0.15,
    centerX - helmetWidth * 0.5,
    helmetBottomY
  );

  ctx.fillStyle = NKU_BLACK;
  ctx.strokeStyle = NKU_GOLD;
  ctx.fill();
  ctx.stroke();

  // === 2) Center ridge (gold strip down the middle) ===
  ctx.beginPath();
  ctx.moveTo(centerX, helmetTopY - helmetHeight * 0.35);
  ctx.lineTo(centerX, helmetBottomY);
  ctx.strokeStyle = NKU_GOLD;
  ctx.lineWidth = 5;
  ctx.stroke();
  ctx.lineWidth = 3; // reset for later

  // === 3) Gold band across the front ===
  const bandHeight = helmetHeight * 0.22;
  const bandTopY = topFaceY - bandHeight * 0.4;

  ctx.beginPath();
  ctx.moveTo(centerX - helmetWidth * 0.55, bandTopY);
  ctx.lineTo(centerX + helmetWidth * 0.55, bandTopY);
  ctx.lineTo(centerX + helmetWidth * 0.5, bandTopY + bandHeight);
  ctx.lineTo(centerX - helmetWidth * 0.5, bandTopY + bandHeight);
  ctx.closePath();

  ctx.fillStyle = NKU_GOLD;
  ctx.strokeStyle = NKU_BLACK;
  ctx.fill();
  ctx.stroke();

  // === 4) Small "NKU" plate in the center of the band ===
  const plateWidth = helmetWidth * 0.25;
  const plateHeight = bandHeight * 0.7;
  const plateX = centerX - plateWidth / 2;
  const plateY = bandTopY + (bandHeight - plateHeight) / 2;

  ctx.fillStyle = NKU_BLACK;
  ctx.fillRect(plateX, plateY, plateWidth, plateHeight);

  ctx.fillStyle = NKU_GOLD;
  ctx.font = `${Math.floor(plateHeight * 0.7)}px system-ui`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("NKU", centerX, plateY + plateHeight / 2);

  // === 5) Horns (white with gold outline, more Norse-y) ===
  ctx.strokeStyle = NKU_GOLD;
  ctx.fillStyle = NKU_WHITE;

  const hornBaseY = helmetTopY + helmetHeight * 0.15;

  // Left horn
  const leftBaseX = centerX - helmetWidth * 0.55;
  ctx.beginPath();
  ctx.moveTo(leftBaseX, hornBaseY);
  ctx.quadraticCurveTo(
    leftBaseX - helmetWidth * 0.4,
    hornBaseY - helmetHeight * 0.9,
    leftBaseX + helmetWidth * 0.05,
    hornBaseY - helmetHeight * 0.85
  );
  ctx.quadraticCurveTo(
    leftBaseX - helmetWidth * 0.25,
    hornBaseY - helmetHeight * 0.7,
    leftBaseX,
    hornBaseY
  );
  ctx.fill();
  ctx.stroke();

  // Right horn
  const rightBaseX = centerX + helmetWidth * 0.55;
  ctx.beginPath();
  ctx.moveTo(rightBaseX, hornBaseY);
  ctx.quadraticCurveTo(
    rightBaseX + helmetWidth * 0.4,
    hornBaseY - helmetHeight * 0.9,
    rightBaseX - helmetWidth * 0.05,
    hornBaseY - helmetHeight * 0.85
  );
  ctx.quadraticCurveTo(
    rightBaseX + helmetWidth * 0.25,
    hornBaseY - helmetHeight * 0.7,
    rightBaseX,
    hornBaseY
  );
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

    function renderLoop() {
      if (!canvas.width || !canvas.height) {
        requestAnimationFrame(renderLoop);
        return;
      }

      drawStaticHelmet();
      statusEl.textContent = "Overlay active: static Viking helmet on top of video 🪖";

      requestAnimationFrame(renderLoop);
    }

    async function init() {
      await setupCamera();
      renderLoop();
    }

    init();
  </script>
</body>
</html>
