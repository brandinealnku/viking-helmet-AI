<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple People Detection</title>
    <style>
        #video {
            width: 100%;
            max-width: 600px;
        }
        #person-count {
            font-size: 24px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Real-time Multiple People Detection</h1>
    <video id="video" autoplay muted></video>
    <div id="person-count">People detected: 0</div>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script>
        const video = document.getElementById('video');
        const personCountDisplay = document.getElementById('person-count');
        let net;

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    resolve(video);
                };
            });
        }

        async function detect() {
            const ctx = video.getContext('2d');
            const predictions = await net.detect(video);
            ctx.clearRect(0, 0, video.width, video.height);
            predictions.forEach(prediction => {
                if (prediction.class === 'person') {
                    ctx.beginPath();
                    ctx.rect(prediction.bbox[0], prediction.bbox[1], prediction.bbox[2], prediction.bbox[3]);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = 'green';
                    ctx.fillStyle = 'green';
                    ctx.stroke();
                    ctx.fillText(prediction.class, prediction.bbox[0], prediction.bbox[1] > 10 ? prediction.bbox[1] - 5 : 10);
                }
            });
            personCountDisplay.innerText = `People detected: ${predictions.filter(p => p.class === 'person').length}`;
            requestAnimationFrame(detect);
        }

        async function init() {
            await setupCamera();
            video.play();
            net = await cocoSsd.load();
            detect();
        }

        init();
    </script>
</body>
</html>
