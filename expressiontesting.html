  <script>
    (function () {
      "use strict";

      const video = document.getElementById("video");
      const canvas = document.getElementById("overlay");
      const ctx = canvas.getContext("2d");
      const statusText = document.getElementById("statusText");
      const statusDot = document.getElementById("statusDot");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const videoSkeleton = document.getElementById("videoSkeleton");
      const expressionTextEl = document.getElementById("expressionText");

      let faceModel = null;      // BlazeFace
      let videoReady = false;
      let aiRunning = false;
      let lastRenderTime = 0;
      let animationId = null;
      let mediaStream = null;

      // 🔁 Face smoothing + hold
      let lastFaceBox = null;      // { topLeft: [x1,y1], bottomRight: [x2,y2] }
      let lastFaceTime = 0;        // timestamp of last detection
      const FACE_HOLD_MS = 250;    // keep last face box briefly when detection drops
      const SMOOTH_ALPHA = 0.15;   // 0–1; lower = smoother, higher = snappier

      // 🔤 Expression smoothing
      let currentExpressionText = "";
      let stableExpression = "";
      let lastRawExpression = "";
      let lastRawExpressionTime = 0;
      const EXPRESSION_HOLD_MS = 250; // how long a new expression must persist before switching

      function setStatus(message, mode = "idle") {
        statusText.textContent = message;
        statusDot.classList.remove("active", "error");
        if (mode === "active") {
          statusDot.classList.add("active");
        } else if (mode === "error") {
          statusDot.classList.add("error");
        }
      }

      async function getBestBackend() {
        if (!window.tf) return;

        const backendsToTry = ["webgl", "wasm", "cpu"];
        for (const b of backendsToTry) {
          try {
            const result = await tf.setBackend(b);
            if (result) {
              await tf.ready();
              console.log("✅ Using TFJS backend:", tf.getBackend());
              return;
            }
          } catch (e) {
            console.warn("Backend not available:", b, e);
          }
        }
        console.warn("Using default TFJS backend:", tf.getBackend());
      }

      async function setupCamera() {
        if (!navigator.mediaDevices?.getUserMedia) {
          setStatus(
            "This browser does not support camera access. Try a recent version of Chrome, Edge, Firefox, or Safari.",
            "error"
          );
          throw new Error("getUserMedia not supported");
        }

        const constraints = {
          audio: false,
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 },
            facingMode: "user"
          }
        };

        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          mediaStream = stream;
          video.srcObject = stream;

          return new Promise((resolve) => {
            video.onloadedmetadata = () => {
              video.play();
              canvas.width = video.videoWidth || 640;
              canvas.height = video.videoHeight || 480;

              videoReady = true;
              videoSkeleton.style.display = "none";
              console.log("🎥 Video ready:", canvas.width, canvas.height);
              resolve();
            };
          });
        } catch (err) {
          console.error("Camera error:", err);
          setStatus(
            "We couldn’t access your camera. Check permissions and make sure no other app is using it.",
            "error"
          );
          throw err;
        }
      }

      // Helpers for BlazeFace boxes
      function isValidPoint(pt) {
        return (
          Array.isArray(pt) &&
          pt.length >= 2 &&
          typeof pt[0] === "number" &&
          typeof pt[1] === "number" &&
          Number.isFinite(pt[0]) &&
          Number.isFinite(pt[1])
        );
      }

      function isValidBox(topLeft, bottomRight) {
        if (!isValidPoint(topLeft) || !isValidPoint(bottomRight)) return false;
        const [x1, y1] = topLeft;
        const [x2, y2] = bottomRight;
        const faceWidth = x2 - x1;
        const faceHeight = y2 - y1;
        return faceWidth > 0 && faceHeight > 0;
      }

      // Smooth between previous and new face box
      function smoothBox(oldBox, newBox, alpha) {
        if (!oldBox) return newBox;
        const [ox1, oy1] = oldBox.topLeft;
        const [ox2, oy2] = oldBox.bottomRight;
        const [nx1, ny1] = newBox.topLeft;
        const [nx2, ny2] = newBox.bottomRight;

        const sx1 = ox1 + alpha * (nx1 - ox1);
        const sy1 = oy1 + alpha * (ny1 - oy1);
        const sx2 = ox2 + alpha * (nx2 - ox2);
        const sy2 = oy2 + alpha * (ny2 - oy2);

        return {
          topLeft: [sx1, sy1],
          bottomRight: [sx2, sy2]
        };
      }

      // Rough expression from landmarks
      function getExpressionFromFace(face) {
        if (!face || !Array.isArray(face.landmarks)) return "";

        const topLeft = face.topLeft;
        const bottomRight = face.bottomRight;
        if (!Array.isArray(topLeft) || !Array.isArray(bottomRight)) return "";

        const [x1, y1] = topLeft;
        const [x2, y2] = bottomRight;
        const faceWidth = x2 - x1;
        const faceHeight = y2 - y1;

        if (faceWidth <= 0 || faceHeight <= 0) return "";

        // BlazeFace landmarks: [rightEye, leftEye, nose, mouth, rightEar, leftEar]
        const mouth = face.landmarks[3];
        const leftEye = face.landmarks[1];
        const rightEye = face.landmarks[0];

        if (!mouth || !leftEye || !rightEye) return "";

        const normMouthY = (mouth[1] - y1) / faceHeight;
        const eyeDistance = Math.hypot(
          leftEye[0] - rightEye[0],
          leftEye[1] - rightEye[1]
        );
        const normEyeDistance = eyeDistance / faceWidth;

        if (normMouthY > 0.68) {
          return "😮 Surprised";
        } else if (normMouthY > 0.50 && normEyeDistance > 0.32) {
          return "😄 Smiling";
        } else {
          return "😐 Neutral";
        }
      }

      // Smooth the expression label over time
      function updateStableExpression(rawExpression, timestamp) {
        if (!rawExpression) {
          return stableExpression;
        }

        // First-ever expression
        if (!stableExpression && !lastRawExpression) {
          stableExpression = rawExpression;
          lastRawExpression = rawExpression;
          lastRawExpressionTime = timestamp;
          return stableExpression;
        }

        if (rawExpression === stableExpression) {
          // Still matching what we show – refresh raw state
          lastRawExpression = rawExpression;
          lastRawExpressionTime = timestamp;
          return stableExpression;
        }

        if (rawExpression === lastRawExpression) {
          // Candidate matches previous raw; has it persisted long enough?
          if (timestamp - lastRawExpressionTime > EXPRESSION_HOLD_MS) {
            stableExpression = rawExpression;
          }
        } else {
          // New candidate; start timing
          lastRawExpression = rawExpression;
          lastRawExpressionTime = timestamp;
        }

        return stableExpression;
      }

      function drawExpressionLabel(ctx, text, canvasWidth) {
        if (!text) return;

        const paddingX = 16;

        ctx.save();
        ctx.font = "600 18px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
        ctx.textBaseline = "top";

        const metrics = ctx.measureText(text);
        const textWidth = metrics.width;
        const boxWidth = textWidth + paddingX * 2;
        const boxHeight = 32;

        const x = 16;
        const y = 16;

        ctx.fillStyle = "rgba(17, 24, 39, 0.8)";
        const radius = 999;

        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + boxWidth - radius, y);
        ctx.quadraticCurveTo(x + boxWidth, y, x + boxWidth, y + radius);
        ctx.lineTo(x + boxWidth, y + boxHeight - radius);
        ctx.quadraticCurveTo(
          x + boxWidth,
          y + boxHeight,
          x + boxWidth - radius,
          y + boxHeight
        );
        ctx.lineTo(x + radius, y + boxHeight);
        ctx.quadraticCurveTo(x, y + boxHeight, x, y + boxHeight - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#f9fafb";
        ctx.fillText(text, x + paddingX, y + 7);
        ctx.restore();
      }

      async function renderLoop(timestamp) {
        if (!aiRunning || !faceModel) {
          return;
        }

        // 🔍 If the camera stream is gone, stop everything so the overlay doesn't "stick"
        if (
          !videoReady ||
          !mediaStream ||
          !mediaStream.active ||
          video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA
        ) {
          setStatus("Camera feed stopped. Restart the demo to continue.", "error");
          stopExperience(/*fromLoop=*/true);
          return;
        }

        const msSinceLast = timestamp - lastRenderTime;
        if (msSinceLast < 70) {
          animationId = requestAnimationFrame(renderLoop);
          return;
        }
        lastRenderTime = timestamp;

        const w = canvas.width;
        const h = canvas.height;

        ctx.drawImage(video, 0, 0, w, h);

        let predictions = [];
        try {
          predictions = await faceModel.estimateFaces(video, false);
        } catch (e) {
          console.error("Error running BlazeFace:", e);
          setStatus("Error running the face model. Try refreshing the page.", "error");
          aiRunning = false;
          return;
        }

        let boxToUse = null;
        let rawExpression = "";

        if (Array.isArray(predictions) && predictions.length > 0) {
          const face = predictions[0];

          rawExpression = getExpressionFromFace(face);

          const rawBox = {
            topLeft: face.topLeft,
            bottomRight: face.bottomRight
          };

          boxToUse = smoothBox(lastFaceBox, rawBox, SMOOTH_ALPHA);
          lastFaceBox = boxToUse;
          lastFaceTime = timestamp;
        } else {
          if (lastFaceBox && timestamp - lastFaceTime < FACE_HOLD_MS) {
            // Keep last box briefly; don't change expression yet
            boxToUse = lastFaceBox;
          } else {
            // Face really gone – hard reset overlay state
            lastFaceBox = null;
            stableExpression = "";
            lastRawExpression = "";
            lastRawExpressionTime = timestamp;
            currentExpressionText = "";
          }
        }

        if (boxToUse) {
          setStatus("AI is running: updating your expression label.", "active");
        } else {
          setStatus("AI is running: try facing the camera with good lighting.", "active");
        }

        // Smooth expression only when we have a new rawExpression
        if (rawExpression) {
          stableExpression = updateStableExpression(rawExpression, timestamp);
          currentExpressionText = stableExpression;
        }

        if (currentExpressionText) {
          drawExpressionLabel(ctx, currentExpressionText, w);
          expressionTextEl.textContent =
            "We think your expression is: " + currentExpressionText + " (rough, playful estimate)";
        } else {
          expressionTextEl.textContent =
            "No expression detected yet. Try facing the camera with good lighting.";
        }

        animationId = requestAnimationFrame(renderLoop);
      }

      async function startExperience() {
        try {
          startBtn.disabled = true;
          stopBtn.disabled = true;
          setStatus("Requesting camera access…", "idle");
          expressionTextEl.textContent = "Requesting access to your camera…";

          await setupCamera();

          setStatus("Loading AI model…", "idle");
          expressionTextEl.textContent = "Loading the on-device AI model…";
          await getBestBackend();

          faceModel = await blazeface.load();

          aiRunning = true;
          stopBtn.disabled = false;

          setStatus(
            "AI is ready. Look at the camera and try different expressions.",
            "active"
          );
          expressionTextEl.textContent =
            "AI is ready. We’ll show a rough label for Neutral, Smiling, or Surprised.";

          animationId = requestAnimationFrame(renderLoop);
        } catch (err) {
          console.error("Init error:", err);
          startBtn.disabled = false;
          stopBtn.disabled = true;
        }
      }

      function stopExperience(fromLoop = false) {
        aiRunning = false;

        if (animationId !== null) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }

        if (mediaStream) {
          mediaStream.getTracks().forEach((track) => track.stop());
          mediaStream = null;
        }

        video.srcObject = null;
        videoReady = false;

        // Clear all face/expression state
        lastFaceBox = null;
        stableExpression = "";
        lastRawExpression = "";
        lastRawExpressionTime = 0;
        currentExpressionText = "";

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        startBtn.disabled = false;
        stopBtn.disabled = true;

        if (!fromLoop) {
          setStatus("Camera is off. You can restart AI at any time.", "idle");
          expressionTextEl.textContent =
            "Camera and AI are stopped. Tap Start again to restart the demo.";
        }
      }

      startBtn.addEventListener("click", startExperience);
      stopBtn.addEventListener("click", () => stopExperience(false));
    })();
  </script>
