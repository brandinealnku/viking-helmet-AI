<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Viking Helmet Overlay (Reliable Demo)</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 0.25rem;
      text-align: center;
    }
    p {
      margin-top: 0;
      margin-bottom: 1rem;
      text-align: center;
      max-width: 600px;
    }
    #videoContainer {
      position: relative;
      width: 640px;
      height: 480px;
      background: #020617;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 20px;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1; /* above the video */
    }
    #status {
      margin-top: 12px;
      font-size: 1rem;
      color: #a5b4fc;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>🪖 Viking Helmet Overlay (Canvas Demo)</h1>
  <p>
    This shows how JavaScript can draw graphics on top of a live camera feed using
    <code>&lt;canvas&gt;</code>. Real AI demos use the same idea, but move the helmet based on
    face-tracking instead of a fixed position.
  </p>

  <div id="videoContainer">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">Loading camera…</div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    console.log("🔥 Simple overlay script running");

    async function setupCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }
        });
        video.srcObject = stream;

        return new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            console.log("Video size:", video.videoWidth, video.videoHeight);
            resolve();
          };
        });
      } catch (err) {
        console.error("Camera error:", err);
        statusEl.textContent = "Camera error – check permissions & HTTPS.";
      }
    }

    function drawStaticHelmet() {
      const w = canvas.width;
      const h = canvas.height;

      // Clear previous frame
      ctx.clearRect(0, 0, w, h);

      // Optional: faint transparent overlay just to make it obvious
      ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
      ctx.fillRect(0, 0, w, h);

      // We'll put the helmet roughly near the top center of the frame
      const faceWidth = w * 0.3;
      const centerX = w / 2;
      const topFaceY = h * 0.25;

      const helmetWidth = faceWidth * 1.6;
      const helmetHeight = faceWidth * 0.8;
      const helmetCenterY = topFaceY - helmetHeight * 0.4;

      ctx.save();
      ctx.lineWidth = 3;

      // Helmet top
      ctx.fillStyle = "rgba(202, 138, 4, 0.95)";
      ctx.strokeStyle = "rgba(120, 53, 15, 1)";
      ctx.beginPath();
      ctx.ellipse(
        centerX,
        helmetCenterY,
        helmetWidth / 2,
        helmetHeight / 2,
        0,
        Math.PI,
        0,
        true
      );
      ctx.fill();
      ctx.stroke();

      // Helmet band
      ctx.fillStyle = "rgba(250, 204, 21, 0.95)";
      ctx.fillRect(
        centerX - helmetWidth / 2,
        helmetCenterY,
        helmetWidth,
        helmetHeight * 0.18
      );

      // Horns
      ctx.fillStyle = "white";
      ctx.strokeStyle = "white";

      // Left horn
      const leftBase = centerX - helmetWidth * 0.45;
      const baseY = helmetCenterY;
      ctx.beginPath();
      ctx.moveTo(leftBase, baseY);
      ctx.quadraticCurveTo(
        leftBase - helmetWidth * 0.35,
        baseY - helmetHeight,
        leftBase + helmetWidth * 0.05,
        baseY - helmetHeight * 0.9
      );
      ctx.quadraticCurveTo(
        leftBase - helmetWidth * 0.25,
        baseY - helmetHeight * 0.8,
        leftBase,
        baseY
      );
      ctx.fill();
      ctx.stroke();

      // Right horn
      const rightBase = centerX + helmetWidth * 0.45;
      ctx.beginPath();
      ctx.moveTo(rightBase, baseY);
      ctx.quadraticCurveTo(
        rightBase + helmetWidth * 0.35,
        baseY - helmetHeight,
        rightBase - helmetWidth * 0.05,
        baseY - helmetHeight * 0.9
      );
      ctx.quadraticCurveTo(
        rightBase + helmetWidth * 0.25,
        baseY - helmetHeight * 0.8,
        rightBase,
        baseY
      );
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    function renderLoop() {
      if (!canvas.width || !canvas.height) {
        requestAnimationFrame(renderLoop);
        return;
      }

      drawStaticHelmet();
      statusEl.textContent = "Overlay active: static Viking helmet on top of video 🪖";

      requestAnimationFrame(renderLoop);
    }

    async function init() {
      await setupCamera();
      renderLoop();
    }

    init();
  </script>
</body>
</html>
