<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Sunglasses Filter – Safe Tracked Version</title>

  <!-- TensorFlow.js + BlazeFace -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 0.25rem;
      text-align: center;
    }
    p {
      margin-top: 0;
      margin-bottom: 1rem;
      text-align: center;
      max-width: 600px;
    }
    #videoContainer {
      position: relative;
      width: 640px;
      height: 480px;
      background: #020617;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 20px;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1; /* above the video */
    }
    #status {
      margin-top: 12px;
      font-size: 1rem;
      color: #a5b4fc;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>😎 AI Sunglasses Filter (Tracked with Fallback)</h1>
  <p>
    BlazeFace runs in your browser. When it sees a face, it tries to position the sunglasses
    over your eyes; if anything is off, it falls back to centered glasses so the demo always works.
  </p>

  <div id="videoContainer">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">Loading camera…</div>

  <script>
    const NKU_GOLD = "#f7b718";

    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    let model = null;
    let videoReady = false;

    console.log("🔥 Safe tracked sunglasses script running");

    // 1️⃣ Camera setup
    async function setupCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }
        });
        video.srcObject = stream;

        return new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            console.log("Video size:", video.videoWidth, video.videoHeight);
            videoReady = true;
            resolve();
          };
        });
      } catch (err) {
        console.error("Camera error:", err);
        statusEl.textContent = "Camera error – check permissions & HTTPS.";
      }
    }

    // 2️⃣ Helper – draw centered glasses (guaranteed fallback)
    function drawCenteredGlasses() {
      const w = canvas.width;
      const h = canvas.height;
      if (!w || !h) return;

      // Clear first
      ctx.clearRect(0, 0, w, h);

      // Slight dark tint
      ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
      ctx.fillRect(0, 0, w, h);

      const centerX = w / 2;
      const centerY = h * 0.35;

      const glassesWidth = w * 0.45;
      const glassesHeight = h * 0.12;

      const bridgeWidth = glassesWidth * 0.08;
      const lensWidth = (glassesWidth - bridgeWidth) / 2;

      const lensY = centerY - glassesHeight / 2;
      const leftX = centerX - glassesWidth / 2;
      const rightX = leftX + lensWidth + bridgeWidth;

      ctx.save();
      ctx.lineWidth = 4;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      function drawLens(x, y, wLens, hLens) {
        const radius = hLens * 0.4;

        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + wLens - radius, y);
        ctx.quadraticCurveTo(x + wLens, y, x + wLens, y + radius);
        ctx.lineTo(x + wLens, y + hLens - radius);
        ctx.quadraticCurveTo(
          x + wLens,
          y + hLens,
          x + wLens - radius,
          y + hLens
        );
        ctx.lineTo(x + radius, y + hLens);
        ctx.quadraticCurveTo(x, y + hLens, x, y + hLens - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();

        ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
        ctx.fill();
        ctx.strokeStyle = NKU_GOLD;
        ctx.stroke();
      }

      // Left + right lenses
      drawLens(leftX, lensY, lensWidth, glassesHeight);
      drawLens(rightX, lensY, lensWidth, glassesHeight);

      // Bridge
      ctx.beginPath();
      ctx.moveTo(leftX + lensWidth, centerY);
      ctx.lineTo(rightX, centerY);
      ctx.strokeStyle = NKU_GOLD;
      ctx.stroke();

      ctx.restore();
    }

    // 3️⃣ Helper – validate BlazeFace points
    function isValidPoint(pt) {
      return (
        Array.isArray(pt) &&
        pt.length >= 2 &&
        typeof pt[0] === "number" &&
        typeof pt[1] === "number" &&
        Number.isFinite(pt[0]) &&
        Number.isFinite(pt[1])
      );
    }

    // 4️⃣ Draw glasses using bounding box (only if safe)
    function drawGlassesFromBox(topLeft, bottomRight) {
      if (!isValidPoint(topLeft) || !isValidPoint(bottomRight)) {
        return false; // signal that bounding box isn't usable
      }

      const [x1, y1] = topLeft;
      const [x2, y2] = bottomRight;

      const faceWidth = x2 - x1;
      const faceHeight = y2 - y1;

      if (faceWidth <= 0 || faceHeight <= 0) return false;

      const centerX = x1 + faceWidth / 2;

      const glassesWidth = faceWidth * 1.1;
      const glassesHeight = faceHeight * 0.28;
      const glassesY = y1 + faceHeight * 0.25;
      const glassesX = centerX - glassesWidth / 2;

      const bridgeWidth = glassesWidth * 0.08;
      const lensWidth = (glassesWidth - bridgeWidth) / 2;

      const lensY = glassesY;

      ctx.save();
      ctx.lineWidth = 4;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      // Clear & tint
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Debug: small red dot at face center
      ctx.fillStyle = "red";
      ctx.beginPath();
      ctx.arc(centerX, y1 + faceHeight * 0.4, 4, 0, Math.PI * 2);
      ctx.fill();

      function drawLens(x, y, wLens, hLens) {
        const radius = hLens * 0.4;

        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + wLens - radius, y);
        ctx.quadraticCurveTo(x + wLens, y, x + wLens, y + radius);
        ctx.lineTo(x + wLens, y + hLens - radius);
        ctx.quadraticCurveTo(
          x + wLens,
          y + hLens,
          x + wLens - radius,
          y + hLens
        );
        ctx.lineTo(x + radius, y + hLens);
        ctx.quadraticCurveTo(x, y + hLens, x, y + hLens - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();

        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fill();
        ctx.strokeStyle = NKU_GOLD;
        ctx.stroke();
      }

      const leftX = glassesX;
      const rightX = glassesX + lensWidth + bridgeWidth;

      drawLens(leftX, lensY, lensWidth, glassesHeight);
      drawLens(rightX, lensY, glassesHeight ? lensWidth : lensWidth, glassesHeight);

      // Bridge
      ctx.beginPath();
      ctx.moveTo(leftX + lensWidth, lensY + glassesHeight * 0.45);
      ctx.lineTo(rightX, lensY + glassesHeight * 0.45);
      ctx.strokeStyle = NKU_GOLD;
      ctx.stroke();

      ctx.restore();

      return true; // signal success
    }

    // 5️⃣ Main AI loop
    async function renderLoop() {
      if (!model || !videoReady) {
        requestAnimationFrame(renderLoop);
        return;
      }

      try {
        const predictions = await model.estimateFaces(video, false);

        if (predictions && predictions.length > 0) {
          const face = predictions[0];

          if (!window._loggedOnce) {
            console.log("Sample BlazeFace prediction:", face);
            window._loggedOnce = true;
          }

          const topLeft = face.topLeft;
          const bottomRight = face.bottomRight;

          let usedBox = false;
          if (topLeft && bottomRight) {
            usedBox = drawGlassesFromBox(topLeft, bottomRight);
          }

          if (!usedBox) {
            // If bounding box fails, draw centered glasses
            drawCenteredGlasses();
          }

          statusEl.textContent =
            "AI running in browser: sunglasses active 😎 (faces: " +
            predictions.length +
            ")";
        } else {
          // No faces → clear overlay
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          statusEl.textContent = "Model loaded — no face detected yet. 👀";
        }
      } catch (err) {
        console.error("Error in renderLoop:", err);
        statusEl.textContent = "Error in AI loop – falling back to centered glasses.";
        // Fallback so demo still looks like something:
        drawCenteredGlasses();
      }

      requestAnimationFrame(renderLoop);
    }

    // 6️⃣ Init
    async function init() {
      statusEl.textContent = "Loading camera…";
      await setupCamera();

      statusEl.textContent = "Loading AI model (BlazeFace)…";
      try {
        await tf.setBackend("webgl");
      } catch (e) {
        console.warn("Could not set backend to webgl, using default:", e);
      }
      await tf.ready();

      model = await blazeface.load();
      console.log("BlazeFace model loaded:", model);

      statusEl.textContent = "Model loaded. Tracking your face…";
      renderLoop();
    }

    init();
  </script>
</body>
</html>
