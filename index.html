<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Viking Helmet AI Filter (Debug)</title>

  <!-- TensorFlow.js union bundle -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@2.6.0/dist/tf.js"></script>

  <!-- Face Landmarks Detection (MediaPipe facemesh package) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@0.0.1/dist/face-landmarks-detection.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 0.25rem;
      text-align: center;
    }
    p {
      margin-top: 0;
      margin-bottom: 1rem;
      text-align: center;
      max-width: 600px;
    }
    #videoContainer {
      position: relative;
      width: 640px;
      height: 480px;
      background: #020617;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 20px;
    }
canvas {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1; /* make sure it’s above the video */
}
video {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}
    #status {
      margin-top: 12px;
      font-size: 1rem;
      color: #a5b4fc;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>🧪 Canvas Overlay Test (No AI)</h1>
  <p>You should see a green tint over the video if the overlay is working.</p>

  <div id="videoContainer">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">Loading camera…</div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    console.log("🔥 Overlay test script running");

    async function setupCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }
        });
        video.srcObject = stream;

        return new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();

            // Match canvas pixels to video dimensions
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            console.log("Video size:", video.videoWidth, video.videoHeight);
            resolve();
          };
        });
      } catch (err) {
        console.error("Camera error:", err);
        statusEl.textContent = "Camera error – check permissions & HTTPS.";
      }
    }

    function renderLoop() {
      if (!canvas.width || !canvas.height) {
        requestAnimationFrame(renderLoop);
        return;
      }

      // Clear then draw a BIG green overlay so it’s impossible to miss
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(0, 255, 0, 0.3)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Add a red rectangle as extra confirmation
      ctx.strokeStyle = "red";
      ctx.lineWidth = 4;
      ctx.strokeRect(50, 50, canvas.width - 100, canvas.height - 100);

      statusEl.textContent = "If you see green + red, overlay is working ✅";

      requestAnimationFrame(renderLoop);
    }

    async function init() {
      await setupCamera();
      renderLoop();
    }

    init();
  </script>
</body>

</html>
